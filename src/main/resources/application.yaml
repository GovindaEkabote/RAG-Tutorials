server:
  port: 8081

spring:
  application:
    name: RagAssistantApplication

  datasource:
    url: jdbc:postgresql://localhost:5433/ragdb
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

  ai:
    retry:
      max-attempts: 5
      backoff:
        initial-interval: 2s
        multiplier: 2.0
        max-interval: 30s

    model:
      chat: google-genai
      embedding:
        text: google-genai

    google:
      genai:
        api-key: ${GEMINI_API_KEY}

        chat:
          model: gemini-3.5-flash-lite

        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: gemini-embedding-001
            task-type: RETRIEVAL_DOCUMENT
            dimensions: 768            # Force 768-dim output so HNSW index works
    vectorstore:
      pgvector:
        table-name-for-chat-memory: vector_store
        table-name-for-rag: rag_vector_store
        initialize-schema: true       # Auto-create table + index on startup
        dimensions: 768                # Must match embedding.text.dimensions
        index-type: HNSW               # HNSW allowed since 768 <= 2000
        distance-type: COSINE_DISTANCE
app:
  rag:
    force-rebuild: true
    top-k: 20
    similarity-threshold: 0.0
    radius: 1
    chunk:
      size: 800
      min-chunk-size: 200
      min-chunk-to-embed: 50
      max-num-chunks: 8192
      keep-separator: true
    pdf-properties:
      mode: page
      path: classpath:pdfFiles/*.pdf
      pages-per-document: 10
      left-alignment: true
      number-of-top-text-lines-to-delete: 0
      number-of-bottom-text-lines-to-delete: 0
    Query-expansion:
      number-of-queries: 4
    rerank:
      url: https://api.cohere.com/v2/rerank
      api-key: {RERANK_API_KEY}
      model: "rerank-english-v3.0"
      top-n: 6
    synonyms:
      CI/CD: "Continuous Integration and Continuous Delivery"
      DB: "database"
      OS: "Operating System"
      TS: "Tech Stack"
      DD: "Database Design"


logging:
  level:
    org.springframework.ai: DEBUG
    com.gen.ai: DEBUG