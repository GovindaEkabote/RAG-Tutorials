services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d gen_ai_course" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data: